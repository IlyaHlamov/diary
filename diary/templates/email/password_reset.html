<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Сброс пароля</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto;">
        <h2>🔐 Сброс пароля</h2>
        <p>Вы запросили сброс пароля для вашего аккаунта.</p>

        <div style="background: #f4f4f4; padding: 20px; margin: 20px 0; text-align: center;">
            <h3 style="margin: 0; color: #333;">Ваш код подтверждения:</h3>
            <div style="font-size: 32px; font-weight: bold; color: #2563eb; margin: 10px 0;">
                {{ code }}
            </div>
        </div>

        <p>Введите этот код в форме сброса пароля.</p>

        <p style="color: #666; font-size: 14px;">
            ⏳ Код действителен в течение 1 часа.<br>
            ❓ Если вы не запрашивали сброс, проигнорируйте это письмо.
        </p>
    </div>
</body>
</html>
